// BIND 9 test fixture for the DDIVault DNS-provider suite.
// Port 5354 on purpose: rootless containers cannot bind 53.
statistics-channels { inet 0.0.0.0 port 8653 allow { any; }; };

options {
    directory "/var/cache/bind";
    listen-on port 5354 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };   // default deny; each zone opts in by key
};

// Test-only key. Disposable, generated for this fixture, never a real secret.
key "ddivault" {
    algorithm hmac-sha256;
    secret "c3BhbnZhdWx0LXRlc3Qta2V5LWRvLW5vdC11c2U9PQ==";
};

zone "lab.example" {
    type master;
    file "/zones/lab.example.db";
    allow-transfer { key "ddivault"; };
    allow-update { key "ddivault"; };
};

zone "10.in-addr.arpa" {
    type master;
    file "/zones/10.rev.db";
    allow-transfer { key "ddivault"; };
};
