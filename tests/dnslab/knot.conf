server:
    listen: 0.0.0.0@5356

log:
  - target: stdout
    any: info

key:
  - id: ddivault
    algorithm: hmac-sha256
    secret: c3BhbnZhdWx0LXRlc3Qta2V5LWRvLW5vdC11c2U9PQ==

acl:
  - id: xfr-ddivault
    key: ddivault
    action: transfer

template:
  - id: default
    storage: /zones

zone:
  - domain: knot.example
    file: /zones/knot.example.zone
    acl: xfr-ddivault
